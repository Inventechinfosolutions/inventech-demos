<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inventech · Demo Sites</title>
    <link rel="icon" type="image/png" href="brand/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --accent: #2563eb;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: Inter, system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 60%),
          radial-gradient(900px 500px at 100% 0%, #ede9fe 0%, transparent 55%), #f8fafc;
        min-height: 100vh;
      }
      main { max-width: 1180px; margin: 0 auto; padding: 72px 28px 96px; }
      .brand { display: block; height: 58px; width: auto; }
      .kicker { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
      h1 { font-size: clamp(34px, 4.4vw, 52px); font-weight: 700; letter-spacing: -0.02em; margin: 12px 0 14px; }
      .lead { font-size: 18px; color: var(--muted); max-width: 560px; line-height: 1.6; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 28px; margin-top: 56px; }
      .demo {
        display: flex; flex-direction: column; text-decoration: none; color: inherit;
        background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
        box-shadow: 0 1px 2px rgb(15 23 42 / 0.04);
        transition: transform 0.5s var(--ease), box-shadow 0.5s var(--ease), border-color 0.5s var(--ease);
      }
      .demo:hover { transform: translateY(-6px); box-shadow: 0 24px 48px -20px rgb(15 23 42 / 0.25); border-color: #cbd5e1; }
      .shot { aspect-ratio: 16 / 10; overflow: hidden; background: #f1f5f9; border-bottom: 1px solid var(--line); }
      .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform 1.2s var(--ease); }
      .demo:hover .shot img { transform: scale(1.04); }
      .body { padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
      .client { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
      h2 { font-size: 21px; font-weight: 600; }
      .body p { color: var(--muted); line-height: 1.55; font-size: 15px; flex: 1; }
      .open { margin-top: 10px; font-weight: 600; font-size: 15px; color: var(--accent); display: inline-flex; gap: 8px; align-items: center; }
      .open span { transition: transform 0.4s var(--ease); }
      .demo:hover .open span { transform: translateX(5px); }
      .grid { scroll-margin-top: 24px; }
      .pager { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 40px; }
      .pager:empty { display: none; }
      .pager a, .pager span.step {
        display: inline-grid; place-items: center; min-width: 44px; height: 44px; padding: 0 16px; border-radius: 999px;
        border: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 15px; font-weight: 600; text-decoration: none;
        transition: background 0.3s, color 0.3s, border-color 0.3s, transform 0.3s var(--ease);
      }
      .pager a:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
      .pager a.on { background: var(--accent); border-color: var(--accent); color: #fff; }
      .pager .off { opacity: 0.45; }
      .pager .count { margin-left: auto; color: var(--muted); font-size: 14px; }
      footer { margin-top: 72px; color: var(--muted); font-size: 14px; }
      h1 { margin-top: 22px; }
      .admin { float: right; display: flex; align-items: center; gap: 10px; margin-left: 20px; }
      .admin a {
        display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px;
        font-size: 15px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); background: #fff; color: var(--ink);
        transition: background 0.3s, color 0.3s, transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
      }
      .admin a:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -14px rgb(15 23 42 / 0.4); }
      .admin a.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 10px 22px -12px rgb(37 99 235 / 0.7); }
      .admin a.primary:hover { background: #1d4ed8; }
      @media (max-width: 640px) {
        .admin { float: none; margin: 0 0 28px; }
      }

      .rv { opacity: 0; transform: translateY(18px); animation: rise 0.9s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 110ms); }
      @keyframes rise { to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .rv { animation: none; opacity: 1; transform: none; }
        .demo, .shot img, .open span { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <nav class="admin rv"><a class="primary" href="/admin"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>Share links &amp; PINs</a><a href="/logout">Sign out</a></nav>
      <img class="brand rv" src="brand/inventech-logo.png" alt="Inventech Info Solutions" />
      <h1 class="rv" style="--i: 1">Demo Sites</h1>
      <p class="lead rv" style="--i: 2">Live demos and design concepts we have built for our clients. Choose one to open it.</p>

      <section class="grid" id="demos"></section>
      <nav class="pager rv" id="pager" aria-label="Demo pages" style="--i: 5"></nav>

      <footer class="rv" style="--i: 6">© Inventech Info Solutions</footer>
    </main>

    <script>
      const DEMOS = [
        {
          client: "Government of Karnataka · KBOCWWB",
          title: "Labour CESS Tracking & Monitoring System",
          summary: "Animated presenter deck for the Board committee. Use Space to move through each scene.",
          href: "labour-cess/",
          image: "previews/labour-cess.jpg",
        },
        {
          client: "Global Connect",
          title: "Global Connect",
          summary: "Multi-page portal demo for investors, talent and partners, with themes and page transitions.",
          href: "global-connect/",
          image: "previews/global-connect.jpg",
        },
        {
          client: "Karnataka Silk Industries Corporation",
          title: "KSIC · Design Gallery",
          summary: "Eight home page concepts for Mysore Silk, with simple and pleasant animation.",
          href: "ksic/",
          image: "previews/ksic.jpg",
        },
        {
          client: "Bangalore Development Authority",
          title: "BDA · Main Web App",
          summary: "Nine interactive home page designs for BDA, from photo and illustrated to showcase, modern, geometric, orbit, a citizen portal with a new sitemap, a citizen services portal and a watercolour portal, with live content from bdakarnataka.in: services, e-auction, layouts, announcements and news, in English and Kannada.",
          href: "bda/",
          image: "previews/bda.jpg",
        },
        {
          client: "Rajiv Gandhi University of Health Sciences",
          title: "RGUHS FMS · Finance Management System",
          summary: "Finance management for bills, receipts, budgets, payments and bank reconciliation, with a dashboard for each role.",
          href: "fms/",
          image: "previews/fms.jpg",
        },
        {
          client: "Renewable energy · Solar and wind",
          title: "Solar PMIS · Project Management",
          summary: "Approvals portal for solar and wind projects, from developer applications to officer review, approval and milestones, with dashboards for each role.",
          href: "solar/",
          image: "previews/solar.jpg",
        },
        {
          client: "Government guest houses",
          title: "Guest House Booking",
          summary: "Book guest house rooms by city, building and floor, with payment, digital room access and an admin console.",
          href: "guest-house/",
          image: "previews/guest-house.jpg",
        },
        {
          client: "Government of Karnataka · KPID Competent Authority",
          title: "CSMS · Claim Settlement Management System",
          summary: "Executive dashboard for settling investor claims, with victims, eligibility, payments, settlement and audit reports and a Karnataka district map.",
          href: "ocss/",
          image: "previews/ocss.jpg",
        },
        {
          client: "Pension departments",
          title: "PensionFlow AI · Pension Recovery Management",
          summary: "Pensioner records, life verification, documents and recovery of excess pension in instalments, with a dashboard for each role.",
          href: "pension/",
          image: "previews/pension.jpg",
        },
        {
          client: "Government of Karnataka · DIPR",
          title: "DPIR · Advertisement Monitoring Tool",
          summary: "Interactive presentation of the advertisement lifecycle, from campaign creation, approval and assets to multi-channel execution, vendor tracking, verification and reports.",
          href: "dpir/",
          image: "previews/dpir.jpg",
        },
      ];

      const PAGE_SIZE = 6;
      const pages = Math.ceil(DEMOS.length / PAGE_SIZE);
      const grid = document.getElementById("demos");
      const pager = document.getElementById("pager");

      const pageFromHash = () => {
        const n = Number(location.hash.match(/^#page-(\d+)$/)?.[1] || 1);
        return Math.min(Math.max(n, 1), pages);
      };

      function render(page, scroll) {
        const start = (page - 1) * PAGE_SIZE;
        grid.innerHTML = DEMOS.slice(start, start + PAGE_SIZE).map(
          (d, i) => `
            <a class="demo rv" style="--i: ${scroll ? i : i + 3}" href="${d.href}">
              <div class="shot"><img src="${d.image}" alt="${d.title} preview" loading="lazy" /></div>
              <div class="body">
                <div class="client">${d.client}</div>
                <h2>${d.title}</h2>
                <p>${d.summary}</p>
                <div class="open">Open demo <span>→</span></div>
              </div>
            </a>`,
        ).join("");

        if (pages < 2) return (pager.innerHTML = "");
        const btn = (label, target, attrs = "") =>
          `<a href="#page-${target}" ${attrs}>${label}</a>`;
        pager.innerHTML =
          (page > 1 ? btn("← Previous", page - 1, 'class="step"') : `<span class="step off">← Previous</span>`) +
          Array.from({ length: pages }, (_, i) => btn(i + 1, i + 1, i + 1 === page ? 'class="num on" aria-current="page"' : 'class="num"')).join("") +
          (page < pages ? btn("Next →", page + 1, 'class="step"') : `<span class="step off">Next →</span>`) +
          `<span class="count">${start + 1}–${Math.min(start + PAGE_SIZE, DEMOS.length)} of ${DEMOS.length} demos</span>`;

        if (scroll) grid.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      render(pageFromHash(), false);
      addEventListener("hashchange", () => render(pageFromHash(), true));
    </script>
  </body>
</html>
